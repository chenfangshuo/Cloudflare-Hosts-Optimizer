name: Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景。**不要贴真实站点清单、passkey 或完整 URL。**

  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题？
      description: 现在的行为哪里不够用？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么改？
      description: 如果有参数/输出格式的想法，写在这里。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你目前是怎么绕过这个问题的？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 没有包含真实站点清单、passkey、Cookie 或完整 URL
          required: true
